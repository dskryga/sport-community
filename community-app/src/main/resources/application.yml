spring:
  application:
    name: spoc

  liquibase:
    enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5433/community
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 24

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

