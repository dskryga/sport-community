version: '3.8'
services:
  community-db:
    container_name: community-db
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_DB=community
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d community"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: